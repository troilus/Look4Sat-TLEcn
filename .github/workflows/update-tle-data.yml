name: Update TLE Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tlecn

      - name: Download satellite data files
        run: |
          mkdir -p tledata
          # Celestrak CSV
          curl -fsSL --max-time 120 -o tledata/all.csv       "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=csv" || echo "⚠ Failed: all"
          curl -fsSL --max-time 120 -o tledata/amateur.csv   "https://celestrak.org/NORAD/elements/gp.php?GROUP=amateur&FORMAT=csv" || echo "⚠ Failed: amateur"
          curl -fsSL --max-time 120 -o tledata/brightest.csv "https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=csv" || echo "⚠ Failed: brightest"
          curl -fsSL --max-time 120 -o tledata/cubesat.csv   "https://celestrak.org/NORAD/elements/gp.php?GROUP=cubesat&FORMAT=csv" || echo "⚠ Failed: cubesat"
          curl -fsSL --max-time 120 -o tledata/education.csv "https://celestrak.org/NORAD/elements/gp.php?GROUP=education&FORMAT=csv" || echo "⚠ Failed: education"
          curl -fsSL --max-time 120 -o tledata/engineering.csv "https://celestrak.org/NORAD/elements/gp.php?GROUP=engineering&FORMAT=csv" || echo "⚠ Failed: engineering"
          curl -fsSL --max-time 120 -o tledata/geo.csv       "https://celestrak.org/NORAD/elements/gp.php?GROUP=geo&FORMAT=csv" || echo "⚠ Failed: geo"
          curl -fsSL --max-time 120 -o tledata/globalstar.csv "https://celestrak.org/NORAD/elements/gp.php?GROUP=globalstar&FORMAT=csv" || echo "⚠ Failed: globalstar"
          curl -fsSL --max-time 120 -o tledata/gnss.csv      "https://celestrak.org/NORAD/elements/gp.php?GROUP=gnss&FORMAT=csv" || echo "⚠ Failed: gnss"
          curl -fsSL --max-time 120 -o tledata/intelsat.csv  "https://celestrak.org/NORAD/elements/gp.php?GROUP=intelsat&FORMAT=csv" || echo "⚠ Failed: intelsat"
          curl -fsSL --max-time 120 -o tledata/iridium.csv   "https://celestrak.org/NORAD/elements/gp.php?GROUP=iridium-NEXT&FORMAT=csv" || echo "⚠ Failed: iridium"
          curl -fsSL --max-time 120 -o tledata/military.csv  "https://celestrak.org/NORAD/elements/gp.php?GROUP=military&FORMAT=csv" || echo "⚠ Failed: military"
          curl -fsSL --max-time 120 -o tledata/last-30-days.csv "https://celestrak.org/NORAD/elements/gp.php?GROUP=last-30-days&FORMAT=csv" || echo "⚠ Failed: last-30-days"
          curl -fsSL --max-time 120 -o tledata/oneweb.csv    "https://celestrak.org/NORAD/elements/gp.php?GROUP=oneweb&FORMAT=csv" || echo "⚠ Failed: oneweb"
          curl -fsSL --max-time 120 -o tledata/orbcomm.csv   "https://celestrak.org/NORAD/elements/gp.php?GROUP=orbcomm&FORMAT=csv" || echo "⚠ Failed: orbcomm"
          curl -fsSL --max-time 120 -o tledata/resource.csv  "https://celestrak.org/NORAD/elements/gp.php?GROUP=resource&FORMAT=csv" || echo "⚠ Failed: resource"
          curl -fsSL --max-time 120 -o tledata/satnogs.csv   "https://celestrak.org/NORAD/elements/gp.php?GROUP=satnogs&FORMAT=csv" || echo "⚠ Failed: satnogs"
          curl -fsSL --max-time 120 -o tledata/science.csv   "https://celestrak.org/NORAD/elements/gp.php?GROUP=science&FORMAT=csv" || echo "⚠ Failed: science"
          curl -fsSL --max-time 120 -o tledata/spire.csv     "https://celestrak.org/NORAD/elements/gp.php?GROUP=spire&FORMAT=csv" || echo "⚠ Failed: spire"
          curl -fsSL --max-time 120 -o tledata/starlink.csv  "https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=csv" || echo "⚠ Failed: starlink"
          curl -fsSL --max-time 120 -o tledata/swarm.csv     "https://celestrak.org/NORAD/elements/gp.php?GROUP=swarm&FORMAT=csv" || echo "⚠ Failed: swarm"
          curl -fsSL --max-time 120 -o tledata/weather.csv   "https://celestrak.org/NORAD/elements/gp.php?GROUP=weather&FORMAT=csv" || echo "⚠ Failed: weather"
          curl -fsSL --max-time 120 -o tledata/x-comm.csv    "https://celestrak.org/NORAD/elements/gp.php?GROUP=x-comm&FORMAT=csv" || echo "⚠ Failed: x-comm"
          # Other sources
          curl -fsSL --max-time 120 -o tledata/amsat.txt     "https://amsat.org/tle/current/nasabare.txt" || echo "⚠ Failed: amsat"
          curl -fsSL --max-time 120 -o tledata/classified.zip "https://www.mmccants.org/tles/classfd.zip" || echo "⚠ Failed: classified"
          curl -fsSL --max-time 120 -o tledata/mccants.zip   "https://www.mmccants.org/tles/inttles.zip" || echo "⚠ Failed: mccants"
          curl -fsSL --max-time 120 -o tledata/r4uab.txt     "https://r4uab.ru/satonline.txt" || echo "⚠ Failed: r4uab"

      - name: Download transceivers data
        run: |
          curl -fsSL --max-time 120 -o tledata/satnogs_transceivers.json "https://db.satnogs.org/api/transmitters/?format=json&status=active" || echo "⚠ Failed: transceivers"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tledata/
          if ! git diff --staged --quiet; then
            git commit -m "Update TLE data [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
